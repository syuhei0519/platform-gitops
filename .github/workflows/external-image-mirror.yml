# Upstreamの固定OCI objectを、承認されたdispatchでのみGHCRへ同一digestのまま複製します。
name: External image mirror
on:
  workflow_dispatch:
    inputs:
      image:
        description: 再配布資料確認済みのname、または確認済みのみを選ぶall
        required: true
        default: all
        type: string
      execute:
        description: 実際のGHCR copyを行う（falseなら選択したupstreamをread-only検査）
        required: true
        default: false
        type: boolean
      redistribution-approved:
        description: 対象upstreamの再配布条件確認済み
        required: true
        default: false
        type: boolean
      scan-evidence:
        description: read-only検査時に固定TrivyでSBOMと脆弱性gate証跡も作る
        required: true
        default: false
        type: boolean
permissions:
  contents: read
# 同一workflowの単独操作者を前提に直列化する。GHCRに原子的create-if-absentはないため、
# 外部主体との競合まで排除した保証ではない。
concurrency:
  group: platform-lab-external-image-mirror
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - id: inventory
        env:
          SELECT_IMAGE: ${{ inputs.image }}
          INSPECT_ONLY: ${{ ! inputs.execute }}
        run: |
          args=(--select "$SELECT_IMAGE" --github-output "$GITHUB_OUTPUT")
          if test "$INSPECT_ONLY" = true; then args+=(--inspect-only); fi
          python3 -I ci/image-supply.py "${args[@]}"
      - run: python3 -I ci/test-image-supply.py -v
  inspect:
    needs: inventory
    if: ${{ ! inputs.execute }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - if: ${{ inputs['scan-evidence'] }}
        uses: syuhei0519/backend-app/.github/actions/shared-tools@cdea9eda59aa56c8a068a79317da239b8133727e
        with:
          modules: oci-input scan-gate
      - name: Install pinned OCI inspection tool
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.21.7
      - name: Record the fixed upstream OCI identity
        env:
          SOURCE: ${{ matrix.source }}
          SOURCE_DIGEST: ${{ matrix.sourceDigest }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          python3 -I ci/image-inspect.py "$IMAGE_NAME" "$SOURCE" "$SOURCE_DIGEST" receipts
          # The receipt contains public OCI identities only. Keep it visible in
          # the immutable run log when artifact blob download is unavailable.
          python3 -m json.tool receipts/receipt.json
      - name: Record fixed-image SBOM and vulnerability gate
        if: ${{ inputs['scan-evidence'] }}
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p .cache/trivy .oci/layout receipts .security
          (cd tools/oci-input; CGO_ENABLED=0 go build -trimpath -o ../../.security/oci-crane-check ./cmd/oci-crane-check)
          (cd tools/scan-gate; CGO_ENABLED=0 go build -trimpath -o ../../.security/scan-gate .)
          SELECTED_DIGEST="$(python3 -c 'import json; print(json.load(open("receipts/receipt.json"))["selectedManifestDigest"])')"
          CONFIG_DIGEST="$(python3 -c 'import json; print(json.load(open("receipts/receipt.json"))["configDigest"])')"
          SCAN_SOURCE="${SOURCE%@*}@${SELECTED_DIGEST}"
          crane pull "$SCAN_SOURCE" .oci/image.tar --format=oci
          python3 -c 'import tarfile; tarfile.open(".oci/image.tar").extractall(".oci/layout", filter="data")'
          .security/oci-crane-check .oci/layout "$SELECTED_DIGEST" > receipts/layout-reader.json
          python3 -c 'import json; receipt=json.load(open("receipts/receipt.json")); reader=json.load(open("receipts/layout-reader.json")); assert reader["digest"] == receipt["selectedManifestDigest"] and reader["configDigest"] == receipt["configDigest"] and reader["fullLayerValidation"] is True'
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/work" -w /work \
            --entrypoint trivy aquasec/trivy:0.75.0@sha256:9db099105405c648166e6b94155eb32f8da12673cf1f455207f7385cc9a77283 \
            image --download-db-only \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --db-repository public.ecr.aws/aquasecurity/trivy-db:2 \
            --cache-dir .cache/trivy --timeout 5m --quiet
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/work" -w /work \
            --entrypoint sh aquasec/trivy:0.75.0@sha256:9db099105405c648166e6b94155eb32f8da12673cf1f455207f7385cc9a77283 -ec '
              trivy image --input .oci/layout --cache-dir .cache/trivy --skip-db-update --timeout 10m \
                --quiet --no-progress --scanners vuln --list-all-pkgs \
                --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --format json \
                --output receipts/scan.json
              trivy image --input .oci/layout --cache-dir .cache/trivy --skip-db-update --timeout 10m \
                --quiet --no-progress --scanners vuln --format cyclonedx \
                --output receipts/sbom.cdx.json
            '
          .security/scan-gate -policy security/scan-policy.json \
            -db .cache/trivy/db/metadata.json -report receipts/scan.json \
            -out receipts/scan-gate.json -scanner-exit 0 -image-config "$CONFIG_DIGEST"
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-inspection-receipt-${{ matrix.name }}-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: error
          retention-days: 30
  mirror:
    needs: inventory
    if: >-
      inputs.execute && inputs['redistribution-approved'] &&
      vars.ENABLE_EXTERNAL_IMAGE_MIRROR == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install pinned OCI copy tool
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.21.7
          (cd ci/image-copy; go build -o ../../oci-copy-once .)
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Copy the exact OCI object and record its type
        env:
          SOURCE: ${{ matrix.source }}
          SOURCE_DIGEST: ${{ matrix.sourceDigest }}
          DESTINATION: ${{ matrix.destination }}
          IMAGE_NAME: ${{ matrix.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${{ inputs['redistribution-approved'] }}" = true
          PATH="$PWD:$PATH" python3 -I ci/image-mirror.py "$IMAGE_NAME" "$SOURCE" "$DESTINATION" "$SOURCE_DIGEST" receipts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-copy-receipt-${{ matrix.name }}-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: error
          retention-days: 90
