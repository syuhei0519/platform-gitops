# GitHub の変更を受け取り、変更範囲に応じた検査と最終結果の集約を行う CI の入口です。
name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
defaults:
  run:
    shell: bash
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.diff.outputs.docs }}
      base: ${{ steps.diff.outputs.base }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        run: python3 -I ci/github/classify.py
  docs:
    needs: classify
    if: needs.classify.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Documentation and secret checks
        env:
          DOCS_BASE: ${{ needs.classify.outputs.base }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work \
            -e DOCS_BASE="$DOCS_BASE" \
            --entrypoint sh aquasec/trivy:0.75.0@sha256:9db099105405c648166e6b94155eb32f8da12673cf1f455207f7385cc9a77283 -ec 'git config --global --add safe.directory /work; sh ci/docs-check.sh'
  validate:
    needs: classify
    if: needs.classify.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: false
      - uses: syuhei0519/backend-app/.github/actions/shared-tools@cdea9eda59aa56c8a068a79317da239b8133727e # Empty values carry no credential; nonempty/malformed Secret values fail
        with:
          modules: scan-gate
      - name: Verify fixed libxcrypt Debian copyright
        run: |
          status=$(curl --silent --show-error --location --write-out '%{http_code}' \
            https://deb.debian.org/debian/pool/main/libx/libxcrypt/libxcrypt_4.4.33-2.debian.tar.xz \
            --output /tmp/libxcrypt.debian.tar.xz)
          if [ "$status" != 200 ]; then
            echo "::error::libxcrypt-debian-source category=http-$status"
            exit 1
          fi
          if ! tar -tf /tmp/libxcrypt.debian.tar.xz > /tmp/libxcrypt.members; then
            echo '::error::libxcrypt-debian-source category=archive-invalid'
            exit 1
          fi
          member=$(grep -E '(^|/)debian/copyright(\.in)?$' /tmp/libxcrypt.members | head -1 || true)
          if [ -z "$member" ]; then
            first=$(head -1 /tmp/libxcrypt.members)
            echo "::error::libxcrypt-debian-source category=copyright-member-missing first=$first"
            exit 1
          fi
          tar -xOf /tmp/libxcrypt.debian.tar.xz "$member" > /tmp/libxcrypt.copyright
          test -s /tmp/libxcrypt.copyright
          sha256sum /tmp/libxcrypt.copyright
      - name: Policy and boundary tests
        run: bash ci/github/test.sh
      # Test-only fixture source; this is not the runtime application pin.
      - name: Checkout fresh profile application test fixture
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: syuhei0519/application-manifest
          ref: b76624ff732ba534881629265d85fc9e5230a9cf
          path: .build/fresh-profile-application
          fetch-depth: 0
          persist-credentials: false
      - name: Fresh profile contract tests
        env:
          ACCOUNT_CANARY_APPLICATION_SOURCE: ${{ github.workspace }}/.build/fresh-profile-application
        run: |
          # Real cross-repository render tests must not silently skip for missing tools.
          docker run --rm --entrypoint cat alpine/helm:4.2.4@sha256:76c375eed56144c68d6197c55bc5a4552fb42002190b796729901cbab3ae6e51 /usr/bin/helm > .build/helm
          chmod +x .build/helm
          export PATH="$GITHUB_WORKSPACE/.build:$PATH"
          command -v helm
          command -v kubectl
          kubectl version --client
          git -C "$ACCOUNT_CANARY_APPLICATION_SOURCE" cat-file -e 3707f73581da5d04db0e4771dda7c1e82bd0f47c^{commit}
          python3 -m unittest discover -s learning/fresh-profile -p 'test_*.py' -v
      - name: Render, policy and checksum checks
        run: |
          mkdir -p .security/public
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work --entrypoint sh alpine/helm:4.2.4@sha256:76c375eed56144c68d6197c55bc5a4552fb42002190b796729901cbab3ae6e51 -ec "sh ci/validate.sh; .security/scan-gate -check-render-only .rendered -out .security/public/pre-render.json; PE_OBSERVABILITY_RENDER_DIR=.rendered .build/bootstrap-test -test.run 'TestObservabilityContract|TestCollectorContract|TestGrafanaProvisioningBoundary|TestOrderWorkloadsContract' -test.v"
      - name: Checkout paired current application declarations
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: syuhei0519/application-manifest
          ref: 9441c696fc6fece4b431b832b7d7099539210081
          path: .build/current-manifest
          persist-credentials: false
      - name: Learning Account monitoring static checks
        run: |
          python3 -m venv .build/monitoring-venv
          .build/monitoring-venv/bin/python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
          docker run --rm --entrypoint cat alpine/helm:4.2.4@sha256:76c375eed56144c68d6197c55bc5a4552fb42002190b796729901cbab3ae6e51 /usr/bin/helm > .build/helm
          chmod +x .build/helm
          PATH="$PWD/.build:$PATH" PAIRED_APPLICATION_MANIFEST="$PWD/.build/current-manifest" \
            .build/monitoring-venv/bin/python learning/existing-kind/test_current_contract.py
          .build/monitoring-venv/bin/python learning/existing-kind/test_capture_adoption.py
          .build/monitoring-venv/bin/python learning/existing-kind/test_public_runtime_separation.py
          PATH="$PWD/.build:$PATH" .build/monitoring-venv/bin/python learning/existing-kind/current_contract.py \
            --application-manifest "$PWD/.build/current-manifest" \
            --output .rendered/current-resources.yaml \
            --schema-output .rendered/current-schema-resources.yaml
          .build/monitoring-venv/bin/python learning/fresh-profile/test_validate_profile.py
          .build/monitoring-venv/bin/python learning/fresh-profile/validate_profile.py
          .build/monitoring-venv/bin/python learning/fresh-profile/test_validate_image_supply.py
          .build/monitoring-venv/bin/python learning/fresh-profile/validate_image_supply.py
          .build/monitoring-venv/bin/python learning/fresh-profile/test_validate_authority.py
          .build/monitoring-venv/bin/python learning/fresh-profile/validate_authority.py
          .build/monitoring-venv/bin/python learning/fresh-profile/test_validate_acceptance.py
          .build/monitoring-venv/bin/python learning/fresh-profile/validate_acceptance.py
          PATH="$PWD/.build:$PATH" .build/monitoring-venv/bin/python learning/monitoring/validate.py --output .rendered/learning-monitoring
          sh learning/monitoring/check-tools.sh .rendered/learning-monitoring
          PATH="$PWD/.build:$PATH" .build/monitoring-venv/bin/python learning/monitoring/alerting/validate.py .rendered/learning-alerting
          PATH="$PWD/.build/monitoring-venv/bin:$PATH" sh learning/monitoring/alerting/check.sh .rendered/learning-alerting
      - name: Checkout fixed Account chart for Application integration regression
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: syuhei0519/application-manifest
          ref: a817e00f42a659d1dcd8a9766ad2727cc4beee18
          path: .build/metrics-manifest
          persist-credentials: false
      - name: Checkout fixed Core cache implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: argoproj/argo-cd
          ref: e258ee23c3e52266d407572f4bcdfe7d9ed36cb5
          path: .build/argocd-istio
          persist-credentials: false
      - name: Learning progressive delivery static checks
        run: |
          python3 -m venv .build/progressive-venv
          .build/progressive-venv/bin/python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 lupa==2.6
          .build/progressive-venv/bin/python learning/progressive-delivery/validate.py --output .rendered/learning-progressive-delivery
          .build/progressive-venv/bin/python -m unittest discover -s learning/istio -p test_rollouts_access.py -v
          .build/progressive-venv/bin/python learning/istio/check_argocd_cache.py --argocd .build/argocd-istio
          .build/progressive-venv/bin/python learning/sonarqube/check_cache.py --argocd .build/argocd-istio
          python3 -I learning/sonarqube/credential_test.py
          python3 learning/sonarqube/registration_test.py
            .build/helm template sonarqube learning/sonarqube/chart --namespace sonarqube --kube-version 1.36.4 > .rendered/sonarqube.yaml
            .build/progressive-venv/bin/python learning/sonarqube/validate.py .rendered/sonarqube.yaml
            docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0 -strict -summary -kubernetes-version 1.36.0 .rendered/sonarqube.yaml
          .build/progressive-venv/bin/python learning/istio/rollouts_access.py --control-namespace learning-core-test --owner cloud-fixture --cache .build/istio-rollouts-cache --core-config learning/istio/fixtures/core-config.yaml --applications learning/istio/fixtures/no-applications.yaml --registered-namespaces synthetic-services --output .rendered/istio-rollouts-access
          PATH="$PWD/.build:$PATH" .build/progressive-venv/bin/python learning/progressive-delivery/test_application.py --manifest-repo .build/metrics-manifest
          docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0 -strict -summary -kubernetes-version 1.36.0 .rendered/learning-progressive-delivery/control.yaml .rendered/learning-progressive-delivery/target.yaml .rendered/istio-rollouts-access/demo-access.yaml
      - name: Kubernetes schema checks
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0 -strict -summary -kubernetes-version 1.36.0 .rendered/current-schema-resources.yaml
          ! docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0 -strict -summary -kubernetes-version 1.36.0 learning/existing-kind/fixtures/invalid-api-version.yaml
          ! docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0 -strict -summary -kubernetes-version 1.36.0 learning/existing-kind/fixtures/invalid-minimal-spec.yaml
          docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0 -strict -summary -kubernetes-version 1.36.0 .rendered/runner-foundation.yaml .rendered/gitlab-runner.yaml .rendered/observability-foundation.yaml .rendered/prometheus.yaml .rendered/argocd-pods.yaml .rendered/collector-disabled.yaml .rendered/collector-enabled.yaml .rendered/grafana.yaml
            docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0 -strict -summary -kubernetes-version 1.36.0 .rendered/learning-monitoring/rendered.yaml .rendered/learning-alerting/rendered.yaml
            docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0 -strict -summary -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/argoproj.io/application_v1alpha1.json .rendered/applications.yaml
            docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0 -strict -summary -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/argoproj.io/appproject_v1alpha1.json .rendered/projects.yaml
      - name: Source and rendered security checks
        env:
          SECURITY_RENDER_REQUIRED: 'true'
        run: bash ci/github/source-scan.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-results-${{ github.run_attempt }}
          path: .security/public/
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: learning-alerting-render-${{ github.run_attempt }}
          path: .rendered/learning-alerting/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: progressive-analysis-render-${{ github.run_attempt }}
          path: |
            .rendered/learning-progressive-delivery/
            .rendered/istio-rollouts-access/
          retention-days: 30
  ci-result:
    if: always()
    needs: [classify, docs, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Required check
        env:
          DOCS: ${{ needs.classify.outputs.docs }}
          CLASSIFY: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          VALIDATE: ${{ needs.validate.result }}
        run: |
          test "$CLASSIFY" = success
          if test "$DOCS" = true; then test "$DOCS_RESULT" = success; else
            test "$VALIDATE" = success
          fi
