apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fresh-release-definitions
  namespace: fresh-control
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: fresh-platform
  source:
    repoURL: https://github.com/syuhei0519/application-manifest.git
    targetRevision: c879ac072bf78ba33142070932e86503cb7242b8
    path: learning/fresh-profile/release-definition
    helm:
      releaseName: fresh-account-release-definition
      parameters:
      - {name: workloadRevision, value: c879ac072bf78ba33142070932e86503cb7242b8}
      - {name: accountRuntimeImage, value: ghcr.io/syuhei0519/backend-app@sha256:fba8eae42982a0e818581b2ac6b41ba865920dafdbfd7d48c416f98c5b1eaebd}
      - {name: promotionMode, value: manual}
      - {name: syncMode, value: automated}
      - {name: workloadVariant, value: existing-upgrade}
  destination:
    server: https://kubernetes.default.svc
    namespace: fresh-control
  syncPolicy:
    syncOptions: [ApplyOutOfSyncOnly=true, Prune=false]
