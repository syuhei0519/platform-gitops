apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fresh-release-definitions
  namespace: fresh-control
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: fresh-platform
  source:
    repoURL: https://github.com/syuhei0519/application-manifest.git
    targetRevision: 0fc2ae19300af32f86643152e65597b022dcdc0f
    path: learning/fresh-profile/release-definition
    helm:
      releaseName: fresh-account-release-definition
      parameters:
      - {name: workloadRevision, value: 0fc2ae19300af32f86643152e65597b022dcdc0f}
      - {name: accountRuntimeImage, value: PENDING_PLAT211_VERIFIED_IMAGE}
  destination:
    server: https://kubernetes.default.svc
    namespace: fresh-control
  syncPolicy:
    syncOptions: [ApplyOutOfSyncOnly=true, Prune=false]
