    architecture: linux/amd64
  imageSupply:
    decision: PENDING_G2
    immutable: false
    retentionUntil: PENDING_G2
    restoreOwner: PENDING_G2
    cacheIsEvidence: false
    requiredProof: retrieve-hash-architecture-entrypoint-user-args-migration-smoke
  inputs:
    clusterKubeconfigRef: <operator-input:G1-kubeconfig>
    imageSupplyRef: <operator-input:G2-image-supply>
    secrets:
    - name: account-db-runtime
      purpose: Account runtime DML
      destination: fresh-account/account-runtime-db
      owner: PENDING_G3
      expiry: PENDING_G3
      sourceRef: <operator-input:G3-account-runtime-db>
    - name: account-db-migration
      purpose: Account owned-schema migration
      destination: fresh-account/account-migration-db
      owner: PENDING_G3
      expiry: PENDING_G3
      sourceRef: <operator-input:G3-account-migration-db>
    - name: repository-read
      purpose: Argo read-only Git access when public access is unavailable
      destination: fresh-control/repository-read
      owner: PENDING_G3
      expiry: PENDING_G3
      sourceRef: <operator-input:G3-repository-read>
  budget:
    measureAt: [before, peak, after]
    elapsedMaxMinutes: 45
    hostAvailableMemoryMinGiB: 6
    hostFreeDiskMinGiB: 20
    dockerAdditionalDiskMaxGiB: 20
    workloadCPURequestsMaxMilli: 3000
    workloadMemoryRequestsMaxMiB: 6144
    imageBytesMaxGiB: 15
    podPendingMaxSeconds: 60
    unexpectedRestartsMax: 0
    stopOn:
    - host-memory-below-minimum
    - host-disk-below-minimum
    - docker-disk-above-maximum
    - elapsed-budget-exceeded
    - pod-pending-budget-exceeded
    - unexpected-restart
  bootstrap:
    dagFile: learning/fresh-profile/bootstrap-dag.yaml
    checkpointJournalRef: <operator-output:fresh-profile-checkpoints.json>
    resumePolicy: verify-completed-then-continue
    rerunPolicy: idempotent-no-completed-job-recreate
  contracts:
    currentComparison: learning/existing-kind/current-contract.json
    equivalence: learning/fresh-profile/equivalence.json
    secretContract: docs/secret-contract.md
  decisions:
    G1:
      status: pending-approval
      choice: separate-named-sandbox-on-existing-personal-host
    G2:
      status: pending-approval
      choice: registry-or-retained-oci-archive
    G3:
      status: pending-approval
      choice: finite-existing-manual-bootstrap-or-approved-provider
    G4:
      status: pending-cutover
      choice: not-required-for-fresh-acceptance
