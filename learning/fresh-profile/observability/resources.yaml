apiVersion: v1
kind: ServiceAccount
metadata: {name: otel-collector, namespace: fresh-observability}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector, namespace: fresh-observability}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    exporters:
      debug: {verbosity: basic}
      prometheus: {endpoint: 0.0.0.0:8889}
    service:
      pipelines:
        metrics: {receivers: [otlp], exporters: [prometheus, debug]}
        traces: {receivers: [otlp], exporters: [debug]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: fresh-observability}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: otel-collector}}
  template:
    metadata: {labels: {app.kubernetes.io/name: otel-collector}}
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      containers:
      - name: collector
        image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.161.0@sha256:b5cf983651c32c3ca13f936deb51742015a54d121f388cac248923ddeb8cc9fc
        args: [--config=/conf/config.yaml]
        ports:
        - {name: otlp-grpc, containerPort: 4317}
        - {name: otlp-http, containerPort: 4318}
        - {name: prometheus, containerPort: 8889}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
        volumeMounts: [{name: config, mountPath: /conf, readOnly: true}]
      volumes: [{name: config, configMap: {name: otel-collector}}]
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector, namespace: fresh-observability}
spec:
  selector: {app.kubernetes.io/name: otel-collector}
  ports:
  - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
  - {name: otlp-http, port: 4318, targetPort: otlp-http}
  - {name: prometheus, port: 8889, targetPort: prometheus}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: fresh-observability}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: prometheus, namespace: fresh-observability}
spec:
  serviceName: prometheus
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  template:
    metadata: {labels: {app.kubernetes.io/name: prometheus}}
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: false
      containers:
      - name: prometheus
        image: quay.io/prometheus/prometheus:v3.15.0@sha256:86b17a25c2db1d16a61b16b3c8f336679eb19e26333d03e808da387206e40faa
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        ports: [{name: http, containerPort: 9090}]
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 512Mi}
        volumeMounts: [{name: config, mountPath: /etc/prometheus, readOnly: true}]
      volumes: [{name: config, configMap: {name: prometheus}}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus, namespace: fresh-observability}
data:
  prometheus.yml: |
    global: {scrape_interval: 15s}
    scrape_configs:
    - job_name: fresh-otel
      static_configs:
      - targets: [otel-collector.fresh-observability.svc.cluster.local:8889]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: fresh-observability}
spec:
  selector: {app.kubernetes.io/name: prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: grafana, namespace: fresh-observability}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: fresh-observability}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: grafana}}
  template:
    metadata: {labels: {app.kubernetes.io/name: grafana}}
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      containers:
      - name: grafana
        image: docker.io/grafana/grafana:13.2.3@sha256:d84563330dc9d2fd2bc096d0fb96021b5319c75bf6ed555566709998e823dec4
        ports: [{name: http, containerPort: 3000}]
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: fresh-observability}
spec:
  selector: {app.kubernetes.io/name: grafana}
  ports: [{name: http, port: 3000, targetPort: http}]
