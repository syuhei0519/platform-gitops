apiVersion: v1
kind: ServiceAccount
metadata: {name: otel-collector, namespace: fresh-observability}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector, namespace: fresh-observability}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    exporters:
      debug: {verbosity: basic}
      prometheus: {endpoint: 0.0.0.0:8889}
    service:
      pipelines:
        metrics: {receivers: [otlp], exporters: [prometheus, debug]}
        traces: {receivers: [otlp], exporters: [debug]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: fresh-observability}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: otel-collector}}
  template:
    metadata: {labels: {app.kubernetes.io/name: otel-collector}}
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      containers:
      - name: collector
        image: ghcr.io/syuhei0519/platform-lab-images@sha256:b5cf983651c32c3ca13f936deb51742015a54d121f388cac248923ddeb8cc9fc
        args: [--config=/conf/config.yaml]
        ports:
        - {name: otlp-grpc, containerPort: 4317}
        - {name: otlp-http, containerPort: 4318}
        - {name: prometheus, containerPort: 8889}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
        volumeMounts: [{name: config, mountPath: /conf, readOnly: true}]
      volumes: [{name: config, configMap: {name: otel-collector}}]
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector, namespace: fresh-observability}
spec:
  selector: {app.kubernetes.io/name: otel-collector}
  ports:
  - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
  - {name: otlp-http, port: 4318, targetPort: otlp-http}
  - {name: prometheus, port: 8889, targetPort: prometheus}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: fresh-observability}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: prometheus, namespace: fresh-observability}
spec:
  serviceName: prometheus
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  template:
    metadata: {labels: {app.kubernetes.io/name: prometheus}}
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: false
      containers:
      - name: prometheus
        image: ghcr.io/syuhei0519/platform-lab-images@sha256:86b17a25c2db1d16a61b16b3c8f336679eb19e26333d03e808da387206e40faa
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        ports: [{name: http, containerPort: 9090}]
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 512Mi}
        volumeMounts: [{name: config, mountPath: /etc/prometheus, readOnly: true}]
      volumes: [{name: config, configMap: {name: prometheus}}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus, namespace: fresh-observability}
data:
  prometheus.yml: |
    global: {scrape_interval: 15s}
    scrape_configs:
    - job_name: fresh-otel
      static_configs:
      - targets: [otel-collector.fresh-observability.svc.cluster.local:8889]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: fresh-observability}
spec:
  selector: {app.kubernetes.io/name: prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: grafana, namespace: fresh-observability}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: fresh-observability}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: grafana}}
  template:
    metadata: {labels: {app.kubernetes.io/name: grafana}}
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      containers:
      - name: grafana
        image: docker.io/grafana/grafana@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
        ports: [{name: http, containerPort: 3000}]
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
        env:
        - {name: GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION, value: "true"}
        - {name: GF_AUTH_DISABLE_LOGIN, value: "true"}
        - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
        - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
        - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
        - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
        - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
        - {name: GF_USERS_ALLOW_ORG_CREATE, value: "false"}
        - {name: GF_USERS_VIEWERS_CAN_EDIT, value: "false"}
        - {name: GF_ANALYTICS_ENABLED, value: "false"}
        - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
        - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
        - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
        - {name: GF_SNAPSHOTS_EXTERNAL_ENABLED, value: "false"}
        - {name: GF_PLUGINS_PLUGIN_ADMIN_ENABLED, value: "false"}
        - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
        - {name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE, value: "false"}
        readinessProbe:
          httpGet: {path: /api/health, port: http}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: fresh-observability}
spec:
  selector: {app.kubernetes.io/name: grafana}
  ports: [{name: http, port: 3000, targetPort: http}]
