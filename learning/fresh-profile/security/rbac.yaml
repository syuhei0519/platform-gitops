apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: argocd-fresh-control-writer, namespace: fresh-control}
rules:
- {apiGroups: [''], resources: [configmaps, persistentvolumeclaims, services, serviceaccounts], verbs: [get, list, watch]}
- {apiGroups: [apps], resources: [deployments, statefulsets], verbs: [get, list, watch]}
- {apiGroups: [batch], resources: [jobs], verbs: [get, list, watch]}
- {apiGroups: [argoproj.io], resources: [applications, rollouts], verbs: [get, list, watch]}
- {apiGroups: [networking.istio.io], resources: [destinationrules, virtualservices], verbs: [get, list, watch]}
- {apiGroups: [argoproj.io], resources: [applications], verbs: [get, list, watch]}
- {apiGroups: [argoproj.io], resources: [applications], verbs: [create]}
- apiGroups: [argoproj.io]
  resources: [applications]
  verbs: [get, update, patch]
  resourceNames: [account-lightweight-root, fresh-account-release, fresh-observability, fresh-release-definitions]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: argocd-fresh-control-writer, namespace: fresh-control}
subjects: [{kind: ServiceAccount, name: argocd-application-controller, namespace: fresh-control}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: argocd-fresh-control-writer}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: argocd-fresh-account-writer, namespace: fresh-account}
rules:
