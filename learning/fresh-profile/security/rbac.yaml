- {apiGroups: [apps], resources: [statefulsets], verbs: [get, update, patch], resourceNames: [account-postgresql]}
- {apiGroups: [batch], resources: [jobs], verbs: [get, list, watch]}
- {apiGroups: [batch], resources: [jobs], verbs: [create]}
- {apiGroups: [batch], resources: [jobs], verbs: [get, update, patch], resourceNames: [account-db-role-bootstrap, account-migration]}
- {apiGroups: [argoproj.io], resources: [rollouts], verbs: [get, list, watch]}
- {apiGroups: [argoproj.io], resources: [rollouts], verbs: [create]}
- {apiGroups: [argoproj.io], resources: [rollouts], verbs: [get, update, patch], resourceNames: [account-api]}
- {apiGroups: [networking.istio.io], resources: [destinationrules], verbs: [get, list, watch]}
- {apiGroups: [networking.istio.io], resources: [destinationrules], verbs: [create]}
- {apiGroups: [networking.istio.io], resources: [destinationrules], verbs: [get, update, patch], resourceNames: [account-api]}
- {apiGroups: [networking.istio.io], resources: [virtualservices], verbs: [get, list, watch]}
- {apiGroups: [networking.istio.io], resources: [virtualservices], verbs: [create]}
- {apiGroups: [networking.istio.io], resources: [virtualservices], verbs: [get, update, patch], resourceNames: [account-api]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: argocd-fresh-account-writer, namespace: fresh-account}
subjects: [{kind: ServiceAccount, name: argocd-application-controller, namespace: fresh-control}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: argocd-fresh-account-writer}
