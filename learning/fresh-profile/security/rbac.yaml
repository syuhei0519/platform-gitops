- {apiGroups: [networking.istio.io], resources: [destinationrules, virtualservices], verbs: [get, list, watch]}
- {apiGroups: [''], resources: [configmaps, persistentvolumeclaims, services, serviceaccounts], verbs: [create]}
- {apiGroups: [''], resources: [configmaps], verbs: [get, update, patch], resourceNames: [account-role-bootstrap]}
- {apiGroups: [''], resources: [persistentvolumeclaims], verbs: [get, update, patch], resourceNames: [account-data]}
- {apiGroups: [''], resources: [services], verbs: [get, update, patch], resourceNames: [account-api, account-postgresql]}
- {apiGroups: [''], resources: [serviceaccounts], verbs: [get, update, patch], resourceNames: [account-database, account-migration, account-runtime]}
