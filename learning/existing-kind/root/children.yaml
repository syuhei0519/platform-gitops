apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: account-release-definition
  namespace: learning-progressive-control
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: learning-existing
  source:
    repoURL: https://github.com/syuhei0519/application-manifest.git
    targetRevision: main
    path: learning/account-release/application-chart
    helm:
      releaseName: account-release-definition
      valueFiles:
      - ../runtime-profile.yaml
      parameters:
      - name: manifestRevision
        value: $ARGOCD_APP_REVISION
        forceString: true
  destination:
    server: https://kubernetes.default.svc.cluster.local:443
    namespace: learning-progressive-control
  syncPolicy:
    syncOptions:
    - RespectIgnoreDifferences=true
