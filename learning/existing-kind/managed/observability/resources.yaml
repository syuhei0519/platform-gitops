    \ resource.attributes[\"learning_service\"] != nil\n  batch:\n    timeout: 5s\n\
    \    send_batch_size: 512\n    send_batch_max_size: 1024\nexporters:\n  prometheus:\n\
    \    endpoint: 0.0.0.0:8889\n    send_timestamps: true\n    metric_expiration:\
    \ 90s\n    resource_to_telemetry_conversion:\n      enabled: false\n    enable_open_metrics:\
    \ true\n  nop: {}\nextensions:\n  health_check:\n    endpoint: 0.0.0.0:13133\n\
    service:\n  extensions:\n  - health_check\n  telemetry:\n    logs:\n      level:\
    \ warn\n      encoding: json\n  pipelines:\n    metrics:\n      receivers:\n \
    \     - otlp\n      processors:\n      - memory_limiter\n      - filter/account\n\
    \      - k8sattributes/account\n      - transform/revision\n      - batch\n  \
    \    exporters:\n      - prometheus\n    traces:\n      receivers:\n      - otlp\n\
    \      processors:\n      - memory_limiter\n      - batch\n      exporters:\n\
    \      - nop\n"
