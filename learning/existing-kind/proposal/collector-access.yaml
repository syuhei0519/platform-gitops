apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: learning-collector-pods
  namespace: learning-account-release
  labels:
    app.kubernetes.io/part-of: learning-monitoring
    learning.local/owner: plat199-account
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: learning-collector-pods
  namespace: learning-account-release
  labels:
    app.kubernetes.io/part-of: learning-monitoring
    learning.local/owner: plat199-account
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: learning-collector-pods
subjects:
- kind: ServiceAccount
  name: account-release-otel-collector
  namespace: observability
