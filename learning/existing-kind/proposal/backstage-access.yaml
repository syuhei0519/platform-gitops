apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-account
  namespace: learning-account-release
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-account
  namespace: learning-account-release
rules:
- apiGroups:
  - argoproj.io
  resources:
  - rollouts
  resourceNames:
  - account-release
  verbs:
  - get
- apiGroups:
  - argoproj.io
  resources:
  - rollouts/status
  resourceNames:
  - account-release
  verbs:
  - get
  - patch
- apiGroups:
  - argoproj.io
  resources:
  - analysisruns
  verbs:
  - get
  - list
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - networking.istio.io
  resources:
  - virtualservices
  - destinationrules
  resourceNames:
  - account-release
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-account
  namespace: learning-account-release
subjects:
- kind: ServiceAccount
  name: backstage-account
  namespace: learning-account-release
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-account-application
  namespace: learning-progressive-control
rules:
- apiGroups:
  - argoproj.io
  resources:
  - applications
  resourceNames:
  - account-release
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-account-application
  namespace: learning-progressive-control
subjects:
- kind: ServiceAccount
  name: backstage-account
  namespace: learning-account-release
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-account-application
