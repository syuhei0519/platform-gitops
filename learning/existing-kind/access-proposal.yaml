# 既存環境の管理を引き継ぐために必要なアクセス範囲を示す、レビュー用の権限定義です。
# PROPOSAL ONLY. No Secret, delete, bind, escalate or cluster-scoped grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: learning-gitops-adoption
  namespace: synthetic-services
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  - persistentvolumeclaims
  - services
  - serviceaccounts
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - applications
  - appprojects
  - rollouts
  - analysistemplates
  - analysisruns
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - configmaps
  - persistentvolumeclaims
  verbs:
  - create
  - update
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: learning-gitops-adoption
  namespace: synthetic-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: learning-gitops-adoption
subjects:
- kind: ServiceAccount
  name: argocd-application-controller
  namespace: learning-progressive-control
