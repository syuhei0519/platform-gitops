rule_files: []
evaluation_interval: 30s
fuzzy_compare: true
tests:
- name: normal requests
  interval: 30s
  input_series:
  - &id001
    series: up{job="otel-application"}
    values: 1+0x20
  - &id002
    series: pe_go_goroutines{job="account-backend"}
    values: 8+0x20
  - &id003
    series: pe_http_server_requests_total{job="account-backend",instance="one",status_class="2xx"}
    values: 0+30x20
  - &id004
    series: pe_http_server_request_duration_seconds_bucket{job="account-backend",le="0.1"}
    values: 0+30x20
  - &id005
    series: pe_http_server_request_duration_seconds_bucket{job="account-backend",le="+Inf"}
    values: 0+30x20
  promql_expr_test:
  - expr: (vector(0) and on() ((((min(up{job="otel-application"}) == bool 1) * on()
      ((time() - max(timestamp(pe_go_goroutines{job="account-backend"}))) < bool 90)
      * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend"}))) >=
      bool 0)) or vector(0)) == 0)) or ((vector(1) and on() ((((min(up{job="otel-application"})
      == bool 1) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend"})))
      < bool 90) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend"})))
      >= bool 0)) or vector(0)) == 1)) unless on() sum(rate(pe_http_server_requests_total{job="account-backend"}[5m])))
      or (vector(2) and on() ((((min(up{job="otel-application"}) == bool 1) * on()
      ((time() - max(timestamp(pe_go_goroutines{job="account-backend"}))) < bool 90)
      * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend"}))) >=
      bool 0)) or vector(0)) == 1) and on() (sum(rate(pe_http_server_requests_total{job="account-backend"}[5m]))
      == 0)) or (vector(3) and on() ((((min(up{job="otel-application"}) == bool 1)
      * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend"}))) <
      bool 90) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend"})))
      >= bool 0)) or vector(0)) == 1) and on() (sum(rate(pe_http_server_requests_total{job="account-backend"}[5m]))
      > 0))
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 3
  - expr: sum(increase(pe_http_server_requests_total{job="account-backend"}[5m]))
      and on() ((((min(up{job="otel-application"}) == bool 1) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend"})))
      < bool 90) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend"})))
      >= bool 0)) or vector(0)) == 1)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 300
  - expr: sum(rate(pe_http_server_requests_total{job="account-backend"}[5m])) and
      on() ((((min(up{job="otel-application"}) == bool 1) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend"})))
      < bool 90) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend"})))
      >= bool 0)) or vector(0)) == 1)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: ((sum(rate(pe_http_server_requests_total{job="account-backend",status_class=~"4xx|5xx"}[5m]))
      or vector(0)) / sum(rate(pe_http_server_requests_total{job="account-backend"}[5m])))
      and on() (sum(rate(pe_http_server_requests_total{job="account-backend"}[5m]))
      > 0) and on() ((((min(up{job="otel-application"}) == bool 1) * on() ((time()
      - max(timestamp(pe_go_goroutines{job="account-backend"}))) < bool 90) * on()
      ((time() - max(timestamp(pe_go_goroutines{job="account-backend"}))) >= bool
      0)) or vector(0)) == 1)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: histogram_quantile(0.95, sum by (le) (rate(pe_http_server_request_duration_seconds_bucket{job="account-backend"}[5m])))
      and on() (sum(rate(pe_http_server_requests_total{job="account-backend"}[5m]))
      > 0) and on() ((((min(up{job="otel-application"}) == bool 1) * on() ((time()
      - max(timestamp(pe_go_goroutines{job="account-backend"}))) < bool 90) * on()
      ((time() - max(timestamp(pe_go_goroutines{job="account-backend"}))) >= bool
      0)) or vector(0)) == 1)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 0.095
  - expr: sum by (status_class) (rate(pe_http_server_requests_total{job="account-backend"}[5m]))
      and on() ((((min(up{job="otel-application"}) == bool 1) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend"})))
      < bool 90) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend"})))
      >= bool 0)) or vector(0)) == 1)
    eval_time: 10m
    exp_samples:
    - labels: '{status_class="2xx"}'
      value: 1
