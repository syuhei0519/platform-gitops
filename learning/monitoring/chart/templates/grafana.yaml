{{/* Grafana の実行主体・Pod・画面の接続口を出力します。 */}}apiVersion: v1
kind: ServiceAccount
metadata:
  name: learning-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: learning-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {learning.local/workload: learning-grafana, learning.local/owner: {{ .Values.owner | quote }}}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 300
  selector:
    matchLabels: {learning.local/workload: learning-grafana, learning.local/owner: {{ .Values.owner | quote }}}
  template:
    metadata:
      labels:
        {{- include "monitoring.labels" . | nindent 8 }}
        learning.local/workload: learning-grafana
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/grafana-config.yaml") . | sha256sum }}
        checksum/dashboard: {{ .Files.Get "files/account-overview.json" | replace "__ACCOUNT_NAMESPACE__" .Values.accountNamespace | sha256sum }}
    spec:
      serviceAccountName: learning-grafana
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 472, runAsGroup: 472, fsGroup: 472, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: grafana
          image: {{ .Values.images.grafana | quote }}
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/grafana/grafana.ini"]
          ports: [{name: http, containerPort: 3000}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/grafana.ini, subPath: grafana.ini, readOnly: true}
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/learning.yaml, subPath: datasources.yaml, readOnly: true}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/learning.yaml, subPath: providers.yaml, readOnly: true}
            - {name: config, mountPath: /etc/grafana/dashboards/account-overview.json, subPath: account-overview.json, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: learning-grafana-config, defaultMode: 0444}
        - {name: data, emptyDir: {sizeLimit: 512Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
