{{/* Collector の実行主体・Pod・計測データの受信口を出力します。 */}}apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {learning.local/workload: otel-collector, learning.local/owner: {{ .Values.owner | quote }}}
  ports: [{name: otlp-http, port: 4318, targetPort: otlp-http}, {name: metrics, port: 8889, targetPort: metrics}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 300
  selector:
    matchLabels: {learning.local/workload: otel-collector, learning.local/owner: {{ .Values.owner | quote }}}
  template:
    metadata:
      labels:
        {{- include "monitoring.labels" . | nindent 8 }}
        learning.local/workload: otel-collector
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/collector-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: collector
          image: {{ .Values.images.collector | quote }}
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otel/config.yaml"]
          ports: [{name: otlp-http, containerPort: 4318}, {name: metrics, containerPort: 8889}, {name: health, containerPort: 13133}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /etc/otel, readOnly: true}
      volumes:
        - name: config
          configMap: {name: otel-collector-config, defaultMode: 0444}
