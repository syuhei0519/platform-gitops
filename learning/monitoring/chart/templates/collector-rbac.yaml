{{/* Collector が計測対象の Pod 情報を読むための権限を定義します。 */}}# Pod metadata only, in the explicitly selected application namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: learning-collector-pods
  namespace: {{ .Values.accountNamespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: learning-collector-pods
  namespace: {{ .Values.accountNamespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: learning-collector-pods}
subjects:
  - {kind: ServiceAccount, name: otel-collector, namespace: {{ .Release.Namespace }}}
