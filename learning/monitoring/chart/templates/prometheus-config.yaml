{{/* Prometheus の収集先と計測・通知ルールを設定として出力します。 */}}apiVersion: v1
kind: ConfigMap
metadata:
  name: learning-prometheus-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    {{- include "monitoring.prometheusConfig" . | nindent 4 }}
{{- if .Values.alerting.enabled }}
  account-alerts.yaml: |
    {{- .Files.Get "files/account-alerts.yaml" | replace "__ACCOUNT_NAMESPACE__" .Values.accountNamespace | replace "__ACCOUNT_SERVICE_NAME__" .Values.alerting.accountServiceName | replace "__ACCOUNT_SERVICE_PORT__" (toString .Values.alerting.accountServicePort) | nindent 4 }}
{{- end }}
