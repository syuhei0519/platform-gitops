apiVersion: v1
kind: ConfigMap
metadata:
  name: learning-prometheus-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    {{- include "monitoring.prometheusConfig" . | nindent 4 }}
{{- if .Values.alerting.enabled }}
  account-alerts.yaml: |
    {{- .Files.Get "files/account-alerts.yaml" | replace "__ACCOUNT_NAMESPACE__" .Values.accountNamespace | nindent 4 }}
{{- end }}
