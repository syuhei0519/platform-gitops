{{/* Grafana の接続先と dashboard を ConfigMap として出力します。 */}}apiVersion: v1
kind: ConfigMap
metadata:
  name: learning-grafana-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
data:
  grafana.ini: |
    {{- include "monitoring.grafanaConfig" . | nindent 4 }}
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Learning Prometheus
        uid: learning-prometheus
        type: prometheus
        access: proxy
        url: http://learning-prometheus.observability.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData: {timeInterval: 30s, httpMethod: POST}
  providers.yaml: |
    apiVersion: 1
    providers:
      - name: learning-account
        orgId: 1
        type: file
        disableDeletion: true
        editable: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options: {path: /etc/grafana/dashboards}
  account-overview.json: |
    {{- .Files.Get "files/account-overview.json" | replace "__ACCOUNT_NAMESPACE__" .Values.accountNamespace | nindent 4 }}
