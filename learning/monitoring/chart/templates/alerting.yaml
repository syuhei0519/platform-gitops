{{- if .Values.alerting.enabled }}
{{- range $name, $file := dict "learning-alertmanager" "alertmanager.yml" "learning-alert-receiver" "receiver.py" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.alerting.namespace }}
  labels:
    {{- include "monitoring.labels" $ | nindent 4 }}
data:
  {{ $file }}: |
    {{- $.Files.Get (printf "files/%s" $file) | replace "__ACCOUNT_NAMESPACE__" $.Values.accountNamespace | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.alerting.namespace }}
  labels:
    {{- include "monitoring.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector: {learning.local/workload: {{ $name }}, learning.local/owner: {{ $.Values.owner | quote }}}
  ports: [{name: http, port: {{ if eq $name "learning-alertmanager" }}9093{{ else }}8080{{ end }}, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.alerting.namespace }}
  labels:
    {{- include "monitoring.labels" $ | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: {learning.local/workload: {{ $name }}, learning.local/owner: {{ $.Values.owner | quote }}}
  template:
    metadata:
      labels:
        {{- include "monitoring.labels" $ | nindent 8 }}
        learning.local/workload: {{ $name }}
      annotations:
        checksum/config: {{ $.Files.Get (printf "files/%s" $file) | replace "__ACCOUNT_NAMESPACE__" $.Values.accountNamespace | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ $name }}
          {{- if eq $name "learning-alertmanager" }}
          image: {{ $.Values.alerting.alertmanagerImage | quote }}
          args: ["--config.file=/config/alertmanager.yml", "--storage.path=/data", "--cluster.listen-address=", "--web.listen-address=0.0.0.0:9093"]
          ports: [{name: http, containerPort: 9093}]
          {{- else }}
          image: {{ $.Values.alerting.receiverImage | quote }}
          command: [python3, -B, /config/receiver.py]
          ports: [{name: http, containerPort: 8080}]
          {{- end }}
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: {{ if eq $name "learning-alertmanager" }}/-/ready{{ else }}/healthz{{ end }}, port: http}
          livenessProbe:
            httpGet: {path: {{ if eq $name "learning-alertmanager" }}/-/healthy{{ else }}/healthz{{ end }}, port: http}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: {{ $name }}, defaultMode: 0444}
        - {name: data, emptyDir: {sizeLimit: 16Mi}}
{{- end }}
{{- end }}
