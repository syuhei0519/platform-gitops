groups:
- name: account-availability
  rules:
  - record: account:sli_state:5m
    expr: (vector(0) unless on() ((((min(up{job="otel-application",account_namespace="__ACCOUNT_NAMESPACE__"}) == bool 1) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}))) < bool 90) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}))) >= bool 0)) or vector(0)) == 1)) or ((vector(1) and on() ((((min(up{job="otel-application",account_namespace="__ACCOUNT_NAMESPACE__"}) == bool 1) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}))) < bool 90) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}))) >= bool 0)) or vector(0)) == 1)) unless on() sum(increase(pe_http_server_requests_total{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m]))) or (vector(2) and on() ((((min(up{job="otel-application",account_namespace="__ACCOUNT_NAMESPACE__"}) == bool 1) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}))) < bool 90) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}))) >= bool 0)) or vector(0)) == 1) and on() (sum(increase(pe_http_server_requests_total{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) == 0) and on() ((sum(increase(pe_http_server_request_duration_seconds_count{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) >= 0) and on() (sum(increase(pe_http_server_request_duration_seconds_bucket{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__",le="0.25"}[5m])) >= 0) and on() (abs(sum(increase(pe_http_server_request_duration_seconds_count{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) - sum(increase(pe_http_server_requests_total{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m]))) < 0.001))) or (vector(3) and on() ((((min(up{job="otel-application",account_namespace="__ACCOUNT_NAMESPACE__"}) == bool 1) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}))) < bool 90) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}))) >= bool 0)) or vector(0)) == 1) and on() (sum(increase(pe_http_server_requests_total{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) > 0) and on() (sum(increase(pe_http_server_requests_total{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) < 20) and on() ((sum(increase(pe_http_server_request_duration_seconds_count{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) >= 0) and on() (sum(increase(pe_http_server_request_duration_seconds_bucket{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__",le="0.25"}[5m])) >= 0) and on() (abs(sum(increase(pe_http_server_request_duration_seconds_count{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) - sum(increase(pe_http_server_requests_total{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m]))) < 0.001))) or (vector(4) and on() ((sum(increase(pe_http_server_requests_total{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) >= 20) and on() ((sum(increase(pe_http_server_request_duration_seconds_count{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) >= 0) and on() (sum(increase(pe_http_server_request_duration_seconds_bucket{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__",le="0.25"}[5m])) >= 0) and on() (abs(sum(increase(pe_http_server_request_duration_seconds_count{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) - sum(increase(pe_http_server_requests_total{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m]))) < 0.001)) and on() ((((min(up{job="otel-application",account_namespace="__ACCOUNT_NAMESPACE__"}) == bool 1) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}))) < bool 90) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}))) >= bool 0)) or vector(0)) == 1))) or ((vector(1) and on() ((((min(up{job="otel-application",account_namespace="__ACCOUNT_NAMESPACE__"}) == bool 1) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}))) < bool 90) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}))) >= bool 0)) or vector(0)) == 1) and on() (sum(increase(pe_http_server_requests_total{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) >= 0)) unless on() ((sum(increase(pe_http_server_request_duration_seconds_count{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) >= 0) and on() (sum(increase(pe_http_server_request_duration_seconds_bucket{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__",le="0.25"}[5m])) >= 0) and on() (abs(sum(increase(pe_http_server_request_duration_seconds_count{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) - sum(increase(pe_http_server_requests_total{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m]))) < 0.001)))
  - record: account:availability_burn_rate:5m
    expr: round(((1 - (((sum(increase(pe_http_server_requests_total{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__",status_class=~"2xx|3xx"}[5m])) or vector(0)) / sum(increase(pe_http_server_requests_total{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m]))) and on() ((sum(increase(pe_http_server_requests_total{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) >= 20) and on() ((sum(increase(pe_http_server_request_duration_seconds_count{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) >= 0) and on() (sum(increase(pe_http_server_request_duration_seconds_bucket{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__",le="0.25"}[5m])) >= 0) and on() (abs(sum(increase(pe_http_server_request_duration_seconds_count{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m])) - sum(increase(pe_http_server_requests_total{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}[5m]))) < 0.001)) and on() ((((min(up{job="otel-application",account_namespace="__ACCOUNT_NAMESPACE__"}) == bool 1) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}))) < bool 90) * on() ((time() - max(timestamp(pe_go_goroutines{job="account-backend",account_namespace="__ACCOUNT_NAMESPACE__"}))) >= bool 0)) or vector(0)) == 1)))) / 0.01) * 1e9) / 1e9
  - alert: AccountAvailabilityBudgetBurn
    expr: account:availability_burn_rate:5m > 2
    for: 2m
    labels:
      severity: warning
      service: backend
      account_namespace: __ACCOUNT_NAMESPACE__
    annotations:
      summary: Account availability budget burn exceeds 2x for 2m
      service_url: http://__ACCOUNT_SERVICE_NAME__.__ACCOUNT_NAMESPACE__.svc.cluster.local:__ACCOUNT_SERVICE_PORT__
      query: account:availability_burn_rate:5m
      state_query: account:sli_state:5m
      runbook_url: https://github.com/syuhei0519/platform-gitops/blob/d66d216f6bce200ec0981673a216cb3ce0a17d90/learning/monitoring/alerting/README.md
      recovery: Resolved is predicate cleared. Healthy recovery requires state=4 and burn<=2; state=0/1/2/3 is unevaluable.
