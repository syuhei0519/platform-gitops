global:
  resolve_timeout: 1m
route:
  receiver: discard
  group_by: [alertname, service, account_namespace]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  routes:
    - receiver: local-test
      matchers:
        - 'alertname="AccountAvailabilityBudgetBurn"'
        - 'severity="warning"'
        - 'service="backend"'
        - 'account_namespace="__ACCOUNT_NAMESPACE__"'
receivers:
  - name: discard
  - name: local-test
    webhook_configs:
      - url: http://learning-alert-receiver.learning-slo-alerts.svc.cluster.local:8080/notifications
        send_resolved: true
