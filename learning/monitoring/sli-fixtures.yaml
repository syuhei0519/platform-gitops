rule_files: []
evaluation_interval: 30s
fuzzy_compare: true
tests:
- name: normal all good fast
  interval: 30s
  input_series:
  - &id001
    series: up{job="otel-application",account_namespace="learning-fixture"}
    values: 1+0x20
  - series: up{job="otel-application",account_namespace="learning-other"}
    values: 0+0x20
  - &id002
    series: pe_go_goroutines{job="account-backend",account_namespace="learning-fixture"}
    values: 8+0x20
  - series: pe_http_server_requests_total{job="account-backend",account_namespace="learning-fixture",instance="one",status_class="2xx"}
    values: 0+30x20
  - series: pe_http_server_requests_total{job="account-backend",account_namespace="learning-fixture",instance="one",status_class="5xx"}
    values: 0+0x20
  - series: pe_http_server_request_duration_seconds_count{job="account-backend",account_namespace="learning-fixture"}
    values: 0+30x20
  - series: pe_http_server_request_duration_seconds_bucket{job="account-backend",account_namespace="learning-fixture",le="0.25"}
    values: 0+30x20
  expected:
    state: 4
    requests: 300
    availability: 1
    error_ratio: 0
    latency: 1
    availability_budget_remaining: 1.0
    latency_budget_remaining: 1.0
- name: 5xx and slow burn budgets
  interval: 30s
  input_series:
  - *id001
  - *id002
  - series: pe_http_server_requests_total{job="account-backend",account_namespace="learning-fixture",instance="one",status_class="2xx"}
    values: 0+29x20
  - series: pe_http_server_requests_total{job="account-backend",account_namespace="learning-fixture",instance="one",status_class="5xx"}
    values: 0+1x20
  - series: pe_http_server_request_duration_seconds_count{job="account-backend",account_namespace="learning-fixture"}
    values: 0+30x20
  - series: pe_http_server_request_duration_seconds_bucket{job="account-backend",account_namespace="learning-fixture",le="0.25"}
    values: 0+27x20
  expected:
    state: 4
    requests: 300
    availability: 0.9666666666666667
    error_ratio: 0.033333333333333326
    latency: 0.9
    availability_budget_remaining: -2.3333333333333326
    latency_budget_remaining: -0.9999999999999996
