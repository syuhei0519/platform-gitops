sonarqube:
  fullnameOverride: sonarqube
  deploymentType: StatefulSet
  replicaCount: 1
  community:
    enabled: true
    buildNumber: 26.9.0.129388
  image:
    # The upstream chart also uses image.tag as a Kubernetes label. Keep its tag
    # label valid while assembling the exact immutable image with repository:tag.
    repository: sonarqube@sha256
    tag: c0f1160bccfa435db4168c2d7df69af3c3ea7bfeb87395613014048fb33a68c1
  initSysctl:
    enabled: false
  initFs:
    enabled: false
  serviceAccount:
    create: false
    automountToken: false
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: '1'
      memory: 4Gi
      ephemeral-storage: 2Gi
    limits:
      cpu: '2'
      memory: 6Gi
      ephemeral-storage: 4Gi
  sonarProperties:
    sonar.web.javaOpts: -Xms128m -Xmx512m
    sonar.ce.javaOpts: -Xms128m -Xmx1g
    sonar.search.javaOpts: -Xms1g -Xmx1g
  persistence:
    enabled: true
    storageClass: standard
    size: 5Gi
    annotations:
      argocd.argoproj.io/sync-options: Prune=false
  jdbcOverwrite:
    enabled: true
    jdbcUrl: jdbc:postgresql://sonarqube-postgresql.sonarqube.svc.cluster.local:5432/sonarqube
    jdbcUsername: sonarqube
    jdbcSecretName: sonarqube-jdbc
    jdbcSecretPasswordKey: password
  monitoringPasscodeSecretName: sonarqube-monitoring
  monitoringPasscodeSecretKey: passcode
  ingress:
    enabled: false
  networkPolicy:
    enabled: false
  tests:
    enabled: false
  extraVolumes:
  - name: tls
    secret:
      secretName: sonarqube-tls
      defaultMode: 288
  - name: tls-config
    configMap:
      name: sonarqube-tls-proxy
  - name: tls-temp
    emptyDir:
      sizeLimit: 128Mi
  extraContainers:
  - name: local-tls
    image: nginxinc/nginx-unprivileged:1.29.5-alpine3.23@sha256:42a7d7f2ee23e9f5a1dcdf3647ba5c585bbd18f79e79cd817e70e8cd61c55779
    command:
    - /usr/sbin/nginx
    - -g
    - daemon off;
    ports:
    - name: local-tls
      containerPort: 8443
    securityContext:
      runAsUser: 10001
      runAsGroup: 0
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    volumeMounts:
    - name: tls
      mountPath: /tls
      readOnly: true
    - name: tls-config
      mountPath: /etc/nginx/nginx.conf
      subPath: nginx.conf
      readOnly: true
    - name: tls-temp
      mountPath: /tmp
