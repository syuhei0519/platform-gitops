apiVersion: v1
kind: Namespace
metadata:
  name: sonarqube
  labels:
    app.kubernetes.io/part-of: plat-3-5-sonarqube
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sonarqube-argocd
  labels:
    app.kubernetes.io/part-of: plat-3-5-sonarqube
  namespace: sonarqube
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  - secrets
  - persistentvolumeclaims
  - services
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - rollouts
  - analysistemplates
  - analysisruns
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - get
  - list
  - watch
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sonarqube-argocd
  labels:
    app.kubernetes.io/part-of: plat-3-5-sonarqube
  namespace: sonarqube
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sonarqube-argocd
subjects:
- kind: ServiceAccount
  name: argocd-application-controller
  namespace: learning-progressive-control
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab-sonarqube
  labels:
    app.kubernetes.io/part-of: plat-3-5-sonarqube
  namespace: learning-progressive-control
spec:
  sourceRepos:
  - https://github.com/syuhei0519/platform-gitops.git
  - https://SonarSource.github.io/helm-chart-sonarqube
  destinations:
  - server: https://kubernetes.default.svc:443
    namespace: sonarqube
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: ''
    kind: PersistentVolumeClaim
  - group: ''
    kind: Service
  - group: apps
    kind: StatefulSet
  - group: networking.k8s.io
    kind: NetworkPolicy
