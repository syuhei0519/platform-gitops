# Argo CD の cache 読み取り範囲を確認するための、限定した試験用リソースです。
# A single non-secret object for the approved alias/cache integration check.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarqube-cache-probe
  namespace: sonarqube
  labels:
    app.kubernetes.io/part-of: sonarqube-cache-probe
data:
  purpose: alias-authentication-and-cache-only
