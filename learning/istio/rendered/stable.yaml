apiVersion: v1
kind: Service
metadata:
  name: mesh-demo
  namespace: learning-istio-demo
spec:
  type: ClusterIP
  selector: {app: mesh-demo}
  ports:
    - {name: http, port: 8080, targetPort: http, appProtocol: http}

---
# Source: istio-learning-demo/templates/demo.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-demo-v1
  namespace: learning-istio-demo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: mesh-demo, version: v1}
  template:
    metadata:
      labels: {app: mesh-demo, version: v1}
    spec:
      serviceAccountName: mesh-demo
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fixture
          image: docker.io/library/python@sha256:9bbb8720ae0a24a6ca8dd678bfdf57818fe70caf54c52a53ec01d8db43405056
          imagePullPolicy: IfNotPresent
          command: [python3, -B, /fixture/demo.py]
          args: [serve, v1]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /fixture, readOnly: true}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /livez, port: http}
          livenessProbe:
            httpGet: {path: /livez, port: http}
      volumes:
        - name: code
          configMap: {name: mesh-demo-code, defaultMode: 0444}

