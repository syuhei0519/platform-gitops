# Source: istio-learning-demo/templates/routing.yaml
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: mesh-demo
  namespace: learning-istio-demo
spec:
  hosts: [mesh-demo.learning-istio-demo.svc.cluster.local]
  exportTo: ["."]
  gateways: [mesh]
  http:
    - name: demo-only
      match:
        - method: {exact: GET}
          uri: {exact: /version}
      retries: {attempts: 0}
      route:
        - destination:
            host: mesh-demo.learning-istio-demo.svc.cluster.local
            subset: v1
            port: {number: 8080}
          weight: 100
        - destination:
            host: mesh-demo.learning-istio-demo.svc.cluster.local
            subset: v2
            port: {number: 8080}
          weight: 0
