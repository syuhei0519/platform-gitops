# kindクラスタの作成時設定。bootstrapの実行主体が固定node imageとともに使う。
# 既存クラスタへGitOpsで適用するKubernetes resourceではない。固定版はbootstrap/versions.lock.yaml。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform-lab
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings: []
