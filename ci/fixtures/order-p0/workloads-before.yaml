---
# Source: workloads/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-local-postgresql
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-10", argocd.argoproj.io/sync-options: Prune=confirm}
spec:
  project: lab-account
  source:
    repoURL: https://github.com/syuhei0519/application-manifest.git
    targetRevision: main
    path: charts/postgresql
    helm:
      releaseName: postgresql
      valueFiles: [../../environments/local/postgresql.yaml]
  destination: {server: https://kubernetes.default.svc, namespace: account}
  syncPolicy:
    automated: {prune: true, selfHeal: true, allowEmpty: false}
    syncOptions: [PruneLast=true, FailOnSharedResource=true]

