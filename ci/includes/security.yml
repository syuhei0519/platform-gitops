# CI/運用検証の入口。.gitlab-ci.ymlが指定する固定入力と検証器を使用する。
# 非成功終了は後続の検査を止める。成功してもcluster変更・merge権限を自動付与するものではない。
security-policy-test:
  stage: test
  image: golang:1.27.1-bookworm@sha256:648f440f42a0958804efb24df176f806f9d353b41f1c0627f666428e40310f6b
  variables: {GOCACHE: /tmp/go-build, GOPATH: /tmp/go}
  script:
    - sh ci/test-docs-check.sh
    - cd tools/scan-gate
    - go test -v ./...
    - mkdir -p ../../.security
    - CGO_ENABLED=0 go build -trimpath -o ../../.security/scan-gate .
  artifacts:
    expire_in: 1 day
    paths: [.security/scan-gate]

source-scan:
  stage: security
  image:
    name: aquasec/trivy:0.75.0@sha256:9db099105405c648166e6b94155eb32f8da12673cf1f455207f7385cc9a77283
    entrypoint: [""]
  needs:
    - job: security-policy-test
      artifacts: true
    - job: render-and-policy
      artifacts: true
  variables: {SECURITY_RENDER_REQUIRED: "true"}
  cache:
    key: trivy-0.75.0-db-v2-$CI_COMMIT_REF_PROTECTED
    paths: [.cache/trivy/db/]
    policy: pull-push
    unprotect: false
  script: ["sh ci/source-scan.sh"]
  artifacts:
    when: always
    expire_in: 30 days
    paths: [.security/public/]
